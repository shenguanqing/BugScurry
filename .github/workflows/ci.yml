name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  windows:
    name: Windows NSIS
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Build Tauri app
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Collect NSIS installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Get-ChildItem -Recurse src-tauri/target/release/bundle/nsis -Filter *.exe |
            ForEach-Object { Copy-Item $_.FullName release/ }
          Get-ChildItem release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BugScurry-windows-x64
          path: release/*
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Collect DMG and app
        run: |
          mkdir -p release
          find src-tauri/target/release/bundle -name "*.dmg" -exec cp {} release/ \;
          # Also keep the .app for local use / notarization later
          if [ -d src-tauri/target/release/bundle/macos/BugScurry.app ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              src-tauri/target/release/bundle/macos/BugScurry.app \
              release/BugScurry-macos-app.zip
          fi
          ls -la release

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BugScurry-macos-arm64
          path: release/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: BugScurry-windows-x64
          path: dist-release

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: BugScurry-macos-arm64
          path: dist-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BugScurry ${{ github.ref_name }}
          files: dist-release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
