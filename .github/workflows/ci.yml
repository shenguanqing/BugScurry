name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  windows:
    name: Windows NSIS
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Build Tauri app
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect NSIS installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          # Updater needs the .sig sidecars: keep exe + sig together.
          Get-ChildItem -Recurse src-tauri/target/release/bundle -Include *.exe,*.sig |
            ForEach-Object { Copy-Item $_.FullName release/ }
          Get-ChildItem release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BugScurry-windows-x64
          path: release/*
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Build Tauri app
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect DMG and app
        run: |
          mkdir -p release
          find src-tauri/target/release/bundle -name "*.dmg" -exec cp {} release/ \;
          # Updater bundles: macOS .tar.gz + every .sig sidecar.
          find src-tauri/target/release/bundle -name "*.tar.gz" -exec cp {} release/ \; || true
          find src-tauri/target/release/bundle -name "*.sig" -exec cp {} release/ \; || true
          # Also keep the .app for local use / notarization later
          if [ -d src-tauri/target/release/bundle/macos/BugScurry.app ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              src-tauri/target/release/bundle/macos/BugScurry.app \
              release/BugScurry-macos-app.zip
          fi
          ls -la release

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BugScurry-macos-arm64
          path: release/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: BugScurry-windows-x64
          path: dist-windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: BugScurry-macos-arm64
          path: dist-macos

      # Public release: DMG + NSIS only. The .app zip stays as a CI artifact
      # for local installs / a future signing pipeline.
      - name: Stage release files
        run: |
          mkdir -p dist-release
          # User downloads: installers only (no .sig sidecars here).
          cp dist-windows/*.exe dist-release/ 2>/dev/null || true
          cp dist-macos/*.dmg dist-release/
          # Updater bundles travel alongside for latest.json below.
          # Copy only the .sig sidecars matching a staged bundle, so strays
          # (e.g. an .msi.sig with no .msi) never reach the Release page.
          for f in dist-release/*.exe; do
            [ -e "$f" ] || continue
            sig="dist-windows/$(basename "$f").sig"
            [ -f "$sig" ] && cp "$sig" dist-release/
          done
          cp dist-macos/*.tar.gz dist-release/ 2>/dev/null || true
          for f in dist-release/*.tar.gz; do
            [ -e "$f" ] || continue
            sig="dist-macos/$(basename "$f").sig"
            [ -f "$sig" ] && cp "$sig" dist-release/
          done
          ls -la dist-release

      - name: Build latest.json for the updater
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import datetime, json, os, pathlib, re
          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          repo = os.environ.get("GITHUB_REPOSITORY", "shenguanqing/BugScurry")
          base = f"https://github.com/{repo}/releases/download/{tag}"
          dist = pathlib.Path("dist-release")

          def sig_for(bundle: pathlib.Path) -> str | None:
              sig = bundle.with_suffix(bundle.suffix + ".sig")
              if sig.exists():
                  return sig.read_text(encoding="utf-8").strip()
              # mac tar.gz sig is "<name>.tar.gz.sig"
              alt = pathlib.Path(str(bundle) + ".sig")
              if alt.exists():
                  return alt.read_text(encoding="utf-8").strip()
              return None

          platforms: dict[str, dict[str, str]] = {}
          # Windows x64 (NSIS setup exe reused by the updater).
          for exe in sorted(dist.glob("*.exe")):
              sig = sig_for(exe)
              if sig:
                  platforms["windows-x86_64"] = {"url": f"{base}/{exe.name}", "signature": sig}
                  break
          # macOS arm64 (tar.gz updater bundle).
          for tgz in sorted(dist.glob("*.tar.gz")):
              sig = sig_for(tgz)
              if sig:
                  platforms["darwin-aarch64"] = {"url": f"{base}/{tgz.name}", "signature": sig}
                  break
          if not platforms:
              print("no updater bundles found; writing version-only latest.json")
          # Updater panel shows these notes as the changelog (UI truncates).
          def section_of(path: pathlib.Path) -> str:
              try:
                  text = path.read_text(encoding="utf-8")
              except OSError:
                  return ""
              m = re.search(
                  rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)",
                  text,
                  re.S,
              )
              return m.group(1).strip()[:4000] if m else ""
          notes = section_of(pathlib.Path("CHANGELOG.md")) or f"BugScurry {tag}"
          payload = {
              "version": version,
              "notes": notes,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platforms": platforms,
          }
          # Per-locale notes for the update dialog (plugin reads `notes`;
          # the app fetches this file directly for the rest).
          for locale in ["zh-CN", "zh-TW", "ja", "ko"]:
              translated = section_of(pathlib.Path(f"CHANGELOG.{locale}.md"))
              if translated:
                  payload[f"notes_{locale}"] = translated
          dist.joinpath("latest.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({**payload, "notes": notes[:200]}, indent=2))
          PY

      # Signatures already live inside latest.json: keep the Release page to
      # installers + updater bundles + latest.json.
      - name: Drop .sig sidecars from the published files
        run: |
          rm -f dist-release/*.sig
          ls -la dist-release

      - name: Build notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import os, re, pathlib, subprocess
          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(
              rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)",
              text,
              re.S,
          )
          section = m.group(1).strip() if m else f"See CHANGELOG.md for {version}."
          # Table lists user-facing installers only: updater bundles (.tar.gz),
          # .sig sidecars, and latest.json would all label as "—".
          files = sorted(
              p.name
              for p in pathlib.Path("dist-release").iterdir()
              if p.suffix.lower() in {".dmg", ".exe"}
          )

          def platform_label(name: str) -> str:
              n = name.lower()
              if n.endswith(".dmg") and "aarch64" in n:
                  return "macOS (Apple Silicon)"
              if n.endswith(".dmg") and ("x64" in n or "x86_64" in n):
                  return "macOS (Intel)"
              if n.endswith(".dmg"):
                  return "macOS"
              if n.endswith(".exe") or "setup" in n:
                  return "Windows x64"
              return "—"

          rows = "\n".join(
              f"| {platform_label(name)} | `{name}` |" for name in files
          )

          def ver_key(t: str) -> tuple[int, ...]:
              return tuple(int(x) if x.isdigit() else 0 for x in t.lstrip("v").split("."))

          def previous_tag(tag: str) -> str | None:
              try:
                  tags = subprocess.check_output(
                      ["git", "tag", "--list", "v*"], text=True
                  ).split()
              except Exception:
                  tags = []
              ordered = sorted(set(tags), key=ver_key)
              return ordered[-2] if len(ordered) >= 2 and ordered[-1] == tag else (
                  ordered[-1] if ordered and ordered[-1] != tag else None
              )

          # Full Changelog links at the previous real tag (v0.6.0 was never
          # tagged, so arithmetic guessing yields a dead compare link).
          base = previous_tag(tag)
          if base is None:
              parts = version.split(".")
              if len(parts) >= 3 and parts[2] != "0":
                  base = f"v{parts[0]}.{parts[1]}.0"
              elif len(parts) >= 2 and parts[1].isdigit() and int(parts[1]) > 0:
                  base = f"v{parts[0]}.{int(parts[1]) - 1}.0"
              else:
                  base = f"v{parts[0]}.0.0"
          repo = os.environ.get("GITHUB_REPOSITORY", "shenguanqing/BugScurry")
          notes = (
              f"## BugScurry v{version}\n\n"
              f"{section}\n\n"
              f"### Downloads\n\n"
              f"| Platform | File |\n"
              f"|----------|------|\n"
              f"{rows}\n\n"
              f"### Installing on macOS\n\n"
              f"The mac build is **not Apple-signed or notarized**, so Gatekeeper may report\n"
              f"\u201cBugScurry.app is damaged\u201d on first launch. The file is fine \u2014 clear the\n"
              f"download quarantine flag and open it again:\n\n"
              f"```bash\n"
              f"xattr -cr /Applications/BugScurry.app\n"
              f"```\n\n"
              f"**Full Changelog**: https://github.com/{repo}/compare/{base}...{tag}\n"
          )
          pathlib.Path("release-notes.md").write_text(notes, encoding="utf-8")
          print(notes)
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BugScurry ${{ github.ref_name }}
          files: dist-release/*
          body_path: release-notes.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
