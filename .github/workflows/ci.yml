name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  windows:
    name: Windows NSIS
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Build Tauri app
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Collect NSIS installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Get-ChildItem -Recurse src-tauri/target/release/bundle/nsis -Filter *.exe |
            ForEach-Object { Copy-Item $_.FullName release/ }
          Get-ChildItem release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BugScurry-windows-x64
          path: release/*
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Collect DMG and app
        run: |
          mkdir -p release
          find src-tauri/target/release/bundle -name "*.dmg" -exec cp {} release/ \;
          # Also keep the .app for local use / notarization later
          if [ -d src-tauri/target/release/bundle/macos/BugScurry.app ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              src-tauri/target/release/bundle/macos/BugScurry.app \
              release/BugScurry-macos-app.zip
          fi
          ls -la release

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BugScurry-macos-arm64
          path: release/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: BugScurry-windows-x64
          path: dist-windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: BugScurry-macos-arm64
          path: dist-macos

      # Public release: DMG + NSIS only. The .app zip stays as a CI artifact
      # for local installs / a future signing pipeline.
      - name: Stage release files
        run: |
          mkdir -p dist-release
          cp dist-windows/* dist-release/
          cp dist-macos/*.dmg dist-release/
          ls -la dist-release

      - name: Build notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import os, re, pathlib
          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(
              rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)",
              text,
              re.S,
          )
          section = m.group(1).strip() if m else f"See CHANGELOG.md for {version}."
          files = sorted(p.name for p in pathlib.Path("dist-release").iterdir())

          def platform_label(name: str) -> str:
              n = name.lower()
              if n.endswith(".dmg") and "aarch64" in n:
                  return "macOS (Apple Silicon)"
              if n.endswith(".dmg") and ("x64" in n or "x86_64" in n):
                  return "macOS (Intel)"
              if n.endswith(".dmg"):
                  return "macOS"
              if n.endswith(".exe") or "setup" in n:
                  return "Windows x64"
              return "—"

          rows = "\n".join(
              f"| {platform_label(name)} | `{name}` |" for name in files
          )
          parts = version.split(".")
          if len(parts) >= 3 and parts[2] != "0":
              base = f"v{parts[0]}.{parts[1]}.0"
          elif int(parts[1]) > 0:
              base = f"v{parts[0]}.{int(parts[1]) - 1}.0"
          else:
              base = f"v{parts[0]}.0.0"
          repo = os.environ.get("GITHUB_REPOSITORY", "shenguanqing/BugScurry")
          notes = (
              f"## BugScurry v{version}\n\n"
              f"{section}\n\n"
              f"### Downloads\n\n"
              f"| Platform | File |\n"
              f"|----------|------|\n"
              f"{rows}\n\n"
              f"**Full Changelog**: https://github.com/{repo}/compare/{base}...{tag}\n"
          )
          pathlib.Path("release-notes.md").write_text(notes, encoding="utf-8")
          print(notes)
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BugScurry ${{ github.ref_name }}
          files: dist-release/*
          body_path: release-notes.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
